version: 2
updates:
  # JS dependencies. `packageManager` in package.json pins yarn 3.5 (the
  # version bundled with JupyterLab as `jlpm`), so Dependabot keeps yarn.lock
  # in the same format instead of rewriting it for a newer yarn.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Only widen a range when a new release falls outside it, so minimum
    # versions (e.g. of the JupyterLab-provided @jupyterlab/application and
    # @jupyter-widgets/base) are not raised just because a newer one exists.
    versioning-strategy: increase-if-necessary
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      # One PR per month for all version updates, majors included.
      npm-all:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
